name: Build macOS App

run-name: >-
  Build macOS App (${{ github.event_name == 'workflow_dispatch' && inputs.configuration || 'Debug' }})
  by @${{ github.actor }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
      publish_release:
        description: Create a GitHub release from this build
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag to create or update when publishing
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Dynamic Dark Mode
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUILD_CONFIGURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.configuration || 'Debug' }}
      DERIVED_DATA_PATH: build/DerivedData
      RESULT_BUNDLE_PATH: build/DynamicDarkMode.xcresult
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner environment
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -a
          xcodebuild -version
          swift --version

      - name: Ensure CocoaPods is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Install Pods
        shell: bash
        run: |
          set -euo pipefail
          pod install

      - name: Build support package target
        shell: bash
        run: |
          set -euo pipefail
          swift build --configuration debug --target DesktopWallpaperSelection

      - name: Test support package
        shell: bash
        run: |
          set -euo pipefail
          swift test --configuration debug

      - name: Build app workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          CURRENT_ARCH="$(uname -m)"
          xcodebuild \
            -workspace "Dynamic Dark Mode.xcworkspace" \
            -scheme "Dynamic Dark Mode" \
            -configuration "$BUILD_CONFIGURATION" \
            -destination "platform=macOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            ARCHS="$CURRENT_ARCH" \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee build/xcodebuild.log

      - name: Package build outputs as DMG
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          hdiutil create -volname "Dynamic-Dark-Mode" -srcfolder "$DERIVED_DATA_PATH/Build/Products/$BUILD_CONFIGURATION/Dynamic Dark Mode.app" -ov -format UDZO "build/artifacts/Dynamic-Dark-Mode-${BUILD_CONFIGURATION}.dmg"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Dark-Mode-${{ env.BUILD_CONFIGURATION }}
          path: |
            build/xcodebuild.log
            build/DynamicDarkMode.xcresult
            build/artifacts/Dynamic-Dark-Mode-${{ env.BUILD_CONFIGURATION }}.dmg
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish Release
    runs-on: macos-15
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    permissions:
      contents: write
    env:
      BUILD_CONFIGURATION: ${{ inputs.configuration }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Dynamic-Dark-Mode-${{ env.BUILD_CONFIGURATION }}
          path: build/release-input

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ inputs.release_tag }}"
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "release_tag is required when publish_release is true" >&2
            exit 1
          fi
          RELEASE_TITLE="Release ${RELEASE_TAG}"
          DMG_PATH="build/release-input/artifacts/Dynamic-Dark-Mode-${BUILD_CONFIGURATION}.dmg"
          test -f "$DMG_PATH"
          echo "Releasing $RELEASE_TAG"
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "Automated release from latest build" --target "${GITHUB_REF_NAME}"
          gh release upload "$RELEASE_TAG" "$DMG_PATH" --clobber
